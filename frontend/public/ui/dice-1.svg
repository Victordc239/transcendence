<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#162033"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6DA93FF"/>
      <stop offset="100%" stop-color="#F7F730FF"/>
    </linearGradient>

    <radialGradient id="core">
      <stop offset="0%" stop-color="#E9FCFF"/>
      <stop offset="40%" stop-color="#E5ECC1FF"/>
      <stop offset="100%" stop-color="#F7F730FF"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow
        dx="0"
        dy="16"
        stdDeviation="18"
        flood-color="#000000"
        flood-opacity="0.45"
      />
    </filter>

  </defs>

  <!-- OUTER GLOW -->
  <rect
    x="76"
    y="76"
    width="360"
    height="360"
    rx="84"
    fill="#F7F730FF"
    opacity="0.18"
    filter="url(#glow)"
  />

  <!-- MAIN BODY -->
  <rect
    x="96"
    y="96"
    width="320"
    height="320"
    rx="72"
    fill="url(#bg)"
    stroke="url(#edge)"
    stroke-width="8"
    filter="url(#shadow)"
  />

  <!-- INNER GLASS -->
  <rect
    x="120"
    y="120"
    width="272"
    height="272"
    rx="58"
    fill="rgba(255,255,255,.03)"
    stroke="rgba(255,255,255,.08)"
    stroke-width="3"
  />

  <!-- HIGHLIGHT -->
  <path
    d="M160 150C200 120 300 120 350 170"
    stroke="rgba(255,255,255,.18)"
    stroke-width="12"
    stroke-linecap="round"
  />

  <!-- DOT -->
  <circle
    cx="256"
    cy="256"
    r="46"
    fill="url(#core)"
    filter="url(#glow)"
  />

  <!-- INNER DOT -->
  <circle
    cx="256"
    cy="256"
    r="20"
    fill="#FFFFFF"
    opacity="0.9"
  />

</svg>