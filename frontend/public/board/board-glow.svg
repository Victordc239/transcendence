<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <filter id="pinkGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blueGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- PINK -->
  <rect
    x="38"
    y="38"
    width="224"
    height="224"
    rx="38"
    stroke="#ff4fd8"
    stroke-width="6"
    opacity="0.9"
    filter="url(#pinkGlow)"
  />

  <!-- PURPLE -->
  <rect
    x="338"
    y="338"
    width="224"
    height="224"
    rx="38"
    stroke="#bb6cff"
    stroke-width="6"
    opacity="0.9"
    filter="url(#purpleGlow)"
  />

  <!-- BLUE -->
  <rect
    x="38"
    y="338"
    width="224"
    height="224"
    rx="38"
    stroke="#37b8ff"
    stroke-width="6"
    opacity="0.9"
    filter="url(#blueGlow)"
  />

  <!-- GREEN -->
  <rect
    x="338"
    y="38"
    width="224"
    height="224"
    rx="38"
    stroke="#37ff99"
    stroke-width="6"
    opacity="0.9"
    filter="url(#greenGlow)"
  />

  <!-- CENTER GOAL GLOW -->
  <circle
    cx="300"
    cy="300"
    r="72"
    stroke="#7dd3fc"
    stroke-width="6"
    opacity="0.7"
    filter="url(#blueGlow)"
  />

  <!-- HORIZONTAL ENERGY -->
  <rect
    x="120"
    y="286"
    width="360"
    height="28"
    rx="14"
    fill="#7dd3fc"
    opacity="0.18"
    filter="url(#blueGlow)"
  />

  <!-- VERTICAL ENERGY -->
  <rect
    x="286"
    y="120"
    width="28"
    height="360"
    rx="14"
    fill="#7dd3fc"
    opacity="0.18"
    filter="url(#blueGlow)"
  />

</svg>