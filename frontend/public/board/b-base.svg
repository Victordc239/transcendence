<svg width="1600" height="1600" viewBox="0 0 1600 1600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1600">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#060816"/>
    </linearGradient>

    <linearGradient id="pinkZone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5EA8"/>
      <stop offset="100%" stop-color="#FF2E7A"/>
    </linearGradient>

    <linearGradient id="purpleZone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B05CFF"/>
      <stop offset="100%" stop-color="#7D2CFF"/>
    </linearGradient>

    <linearGradient id="blueZone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#47D8FF"/>
      <stop offset="100%" stop-color="#178BFF"/>
    </linearGradient>

    <linearGradient id="greenZone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#49FFB3"/>
      <stop offset="100%" stop-color="#0FD976"/>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glowPink">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1600" fill="url(#bg)"/>
  <rect width="1600" height="1600" fill="url(#grid)" opacity="0.25"/>

  <!-- OUTER BOARD -->
  <g filter="url(#shadow)">
    <rect x="180" y="180" width="1240" height="1240" rx="55" fill="#11182D" stroke="#2A3658" stroke-width="8"/>

    <!-- INNER FRAME -->
    <rect x="220" y="220" width="1160" height="1160" rx="40" fill="#151D36" stroke="#3D4C78" stroke-width="4"/>

    <!-- PLAYER ZONES -->
    <rect x="240" y="240" width="430" height="430" rx="40" fill="url(#pinkZone)" opacity="0.2"/>
    <rect x="930" y="240" width="430" height="430" rx="40" fill="url(#greenZone)" opacity="0.2"/>
    <rect x="240" y="930" width="430" height="430" rx="40" fill="url(#blueZone)" opacity="0.2"/>
    <rect x="930" y="930" width="430" height="430" rx="40" fill="url(#purpleZone)" opacity="0.2"/>

    <!-- BASES -->
    <g>
      <!-- PINK BASE -->
      <rect x="300" y="300" width="310" height="310" rx="45" fill="#1B1020" stroke="#FF4B91" stroke-width="6"/>
      <circle cx="390" cy="390" r="38" fill="#2D1628" stroke="#FF5EA8" stroke-width="5"/>
      <circle cx="520" cy="390" r="38" fill="#2D1628" stroke="#FF5EA8" stroke-width="5"/>
      <circle cx="390" cy="520" r="38" fill="#2D1628" stroke="#FF5EA8" stroke-width="5"/>
      <circle cx="520" cy="520" r="38" fill="#2D1628" stroke="#FF5EA8" stroke-width="5"/>

      <!-- GREEN BASE -->
      <rect x="990" y="300" width="310" height="310" rx="45" fill="#0F211B" stroke="#25F19C" stroke-width="6"/>
      <circle cx="1080" cy="390" r="38" fill="#143126" stroke="#49FFB3" stroke-width="5"/>
      <circle cx="1210" cy="390" r="38" fill="#143126" stroke="#49FFB3" stroke-width="5"/>
      <circle cx="1080" cy="520" r="38" fill="#143126" stroke="#49FFB3" stroke-width="5"/>
      <circle cx="1210" cy="520" r="38" fill="#143126" stroke="#49FFB3" stroke-width="5"/>

      <!-- BLUE BASE -->
      <rect x="300" y="990" width="310" height="310" rx="45" fill="#0F1828" stroke="#33CFFF" stroke-width="6"/>
      <circle cx="390" cy="1080" r="38" fill="#16253B" stroke="#47D8FF" stroke-width="5"/>
      <circle cx="520" cy="1080" r="38" fill="#16253B" stroke="#47D8FF" stroke-width="5"/>
      <circle cx="390" cy="1210" r="38" fill="#16253B" stroke="#47D8FF" stroke-width="5"/>
      <circle cx="520" cy="1210" r="38" fill="#16253B" stroke="#47D8FF" stroke-width="5"/>

      <!-- PURPLE BASE -->
      <rect x="990" y="990" width="310" height="310" rx="45" fill="#1C1228" stroke="#B05CFF" stroke-width="6"/>
      <circle cx="1080" cy="1080" r="38" fill="#2A173A" stroke="#C986FF" stroke-width="5"/>
      <circle cx="1210" cy="1080" r="38" fill="#2A173A" stroke="#C986FF" stroke-width="5"/>
      <circle cx="1080" cy="1210" r="38" fill="#2A173A" stroke="#C986FF" stroke-width="5"/>
      <circle cx="1210" cy="1210" r="38" fill="#2A173A" stroke="#C986FF" stroke-width="5"/>
    </g>

    <!-- MAIN TRACK -->
    <g>
      <!-- HORIZONTAL TRACK -->
      <g>
        <rect x="240" y="720" width="1120" height="160" rx="12" fill="#D8DCE7"/>

        <!-- CELLS -->
        <g stroke="#9CA7C5" stroke-width="3">
          <line x1="320" y1="720" x2="320" y2="880"/>
          <line x1="400" y1="720" x2="400" y2="880"/>
          <line x1="480" y1="720" x2="480" y2="880"/>
          <line x1="560" y1="720" x2="560" y2="880"/>
          <line x1="640" y1="720" x2="640" y2="880"/>
          <line x1="720" y1="720" x2="720" y2="880"/>
          <line x1="800" y1="720" x2="800" y2="880"/>
          <line x1="880" y1="720" x2="880" y2="880"/>
          <line x1="960" y1="720" x2="960" y2="880"/>
          <line x1="1040" y1="720" x2="1040" y2="880"/>
          <line x1="1120" y1="720" x2="1120" y2="880"/>
          <line x1="1200" y1="720" x2="1200" y2="880"/>
          <line x1="1280" y1="720" x2="1280" y2="880"/>
        </g>
      </g>

      <!-- VERTICAL TRACK -->
      <g>
        <rect x="720" y="240" width="160" height="1120" rx="12" fill="#D8DCE7"/>

        <g stroke="#9CA7C5" stroke-width="3">
          <line x1="720" y1="320" x2="880" y2="320"/>
          <line x1="720" y1="400" x2="880" y2="400"/>
          <line x1="720" y1="480" x2="880" y2="480"/>
          <line x1="720" y1="560" x2="880" y2="560"/>
          <line x1="720" y1="640" x2="880" y2="640"/>
          <line x1="720" y1="720" x2="880" y2="720"/>
          <line x1="720" y1="800" x2="880" y2="800"/>
          <line x1="720" y1="880" x2="880" y2="880"/>
          <line x1="720" y1="960" x2="880" y2="960"/>
          <line x1="720" y1="1040" x2="880" y2="1040"/>
          <line x1="720" y1="1120" x2="880" y2="1120"/>
          <line x1="720" y1="1200" x2="880" y2="1200"/>
          <line x1="720" y1="1280" x2="880" y2="1280"/>
        </g>
      </g>
    </g>

    <!-- COLORED HOME LANES -->
    <rect x="720" y="240" width="160" height="400" fill="#2BDA8E" opacity="0.85"/>
    <rect x="960" y="720" width="400" height="160" fill="#9A4CFF" opacity="0.85"/>
    <rect x="720" y="960" width="160" height="400" fill="#29BFFF" opacity="0.85"/>
    <rect x="240" y="720" width="400" height="160" fill="#FF4D97" opacity="0.85"/>

    <!-- CENTER GOAL -->
    <g filter="url(#glowPink)">
      <polygon points="800,610 930,740 800,870 670,740" fill="#11182D" stroke="#4A5C88" stroke-width="8"/>

      <polygon points="800,650 885,740 800,830 715,740" fill="#161F3B"/>

      <polygon points="800,670 850,740 800,810 750,740" fill="#1D294B"/>

      <text x="800" y="755" text-anchor="middle" fill="#FFFFFF" font-size="48" font-family="Inter, Arial" font-weight="700">
        
      </text>

      <polygon points="800,610 850,660 750,660" fill="#27F0A1" opacity="0.9"/>
      <polygon points="930,740 880,790 880,690" fill="#B05CFF" opacity="0.9"/>
      <polygon points="800,870 850,820 750,820" fill="#3EC7FF" opacity="0.9"/>
      <polygon points="670,740 720,790 720,690" fill="#FF5EA8" opacity="0.9"/>
    </g>

    <!-- CORNER LIGHTS -->
    <rect x="355" y="255" width="200" height="12" rx="6" fill="#FF5EA8" opacity="0.85"/>
    <rect x="1045" y="255" width="200" height="12" rx="6" fill="#49FFB3" opacity="0.85"/>
    <rect x="355" y="1335" width="200" height="12" rx="6" fill="#47D8FF" opacity="0.85"/>
    <rect x="1045" y="1335" width="200" height="12" rx="6" fill="#C986FF" opacity="0.85"/>
  </g>
</svg>