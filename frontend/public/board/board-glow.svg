<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>
  <filter id="glow">
    <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<g filter="url(#glow)" opacity="0.9">

<rect x="30" y="30" width="340" height="340" rx="40"
stroke="#ff3bd4"
stroke-width="10"/>

<rect x="630" y="30" width="340" height="340" rx="40"
stroke="#00ff9d"
stroke-width="10"/>

<rect x="30" y="630" width="340" height="340" rx="40"
stroke="#00d9ff"
stroke-width="10"/>

<rect x="630" y="630" width="340" height="340" rx="40"
stroke="#c86cff"
stroke-width="10"/>

<polygon
points="440,560 440,440 560,440 560,560"
stroke="#f5f3e2ff"
stroke-width="10"
/>

</g>

</svg>