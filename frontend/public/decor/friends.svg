<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512">

    <defs>

        <linearGradient id="friendsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8655f7"/>
            <stop offset="100%" stop-color="#00d9ff"/>
        </linearGradient>

        <filter id="shadow">
            <feDropShadow
                dx="0"
                dy="6"
                stdDeviation="8"
                flood-opacity="0.22"/>
        </filter>

    </defs>

    <g filter="url(#shadow)">

        <!-- Persona trasera -->
        <circle
            cx="185"
            cy="165"
            r="62"
            fill="url(#friendsGradient)"/>

        <path
            d="
            M95 330
            C95 265 145 235 185 235
            C225 235 275 265 275 330
            Q275 355 250 355
            L120 355
            Q95 355 95 330
            Z"
            fill="url(#friendsGradient)"
            opacity="0.75"/>

        <!-- Persona delantera -->
        <circle
            cx="325"
            cy="185"
            r="72"
            fill="url(#friendsGradient)"/>

        <path
            d="
            M215 380
            C215 300 275 265 325 265
            C375 265 435 300 435 380
            Q435 410 405 410
            L245 410
            Q215 410 215 380
            Z"
            fill="url(#friendsGradient)"/>

    </g>


</svg>