<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>
  <filter id="glow">
    <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<g filter="url(#glow)" opacity="0.9">

<rect x="70" y="70" width="360" height="360" rx="40"
stroke="#ff3bd4"
stroke-width="10"/>

<rect x="570" y="70" width="360" height="360" rx="40"
stroke="#00ff9d"
stroke-width="10"/>

<rect x="70" y="570" width="360" height="360" rx="40"
stroke="#00d9ff"
stroke-width="10"/>

<rect x="570" y="570" width="360" height="360" rx="40"
stroke="#c86cff"
stroke-width="10"/>

<polygon
points="500,390 610,500 500,610 390,500"
stroke="#00e5ff"
stroke-width="10"
/>

</g>

</svg>