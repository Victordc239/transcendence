services:
  db:
    image: postgres:15
    container_name: transcendence_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - transcendence_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: transcendence_backend
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - transcendence_network

  frontend:
    build: ./frontend
    container_name: transcendence_frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - transcendence_network

  nginx:
    build: ./nginx
    container_name: transcendence_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "8443:443"
    networks:
      - transcendence_network

volumes:
  db_data:

networks:
  transcendence_network: